
name: CloudOps CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: app/backend
        run: npm ci

      - name: Start backend and run API tests
        working-directory: app/backend
        env:
          PORT: 3001
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: cloudops_ci
          FRONTEND_ORIGIN: http://localhost:5173
        run: |
          node src/server.js > backend.log 2>&1 &
          echo $! > backend.pid

          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:3001/health > health.json; then
              break
            fi
            sleep 2
          done

          if [ ! -s health.json ]; then
            cat backend.log
            exit 1
          fi

          cat health.json
          npm test
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: false
          tags: cloudops-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: false
          build-args: |
            VITE_API_URL=http://localhost:3001
          tags: cloudops-frontend:ci


  publish:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudops-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudops-backend:sha-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudops-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudops-frontend:sha-${{ github.sha }}