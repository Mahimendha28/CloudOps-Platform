
services:
  backend:
    build:
      context: ./app/backend
    container_name: cloudops-backend
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      FRONTEND_ORIGIN: "http://localhost:5173,http://localhost:8080"
      MONGODB_URI: "mongodb://host.docker.internal:27017"
      MONGODB_DB: "cloudops"
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  frontend:
    build:
      context: ./app/frontend
      args:
        VITE_API_URL: "http://localhost:3001"
    container_name: cloudops-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped


  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: false
          tags: cloudops-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: false
          build-args: |
            VITE_API_URL=http://localhost:3001
          tags: cloudops-frontend:ci
