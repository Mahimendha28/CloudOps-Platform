
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the Compose service name at request time. Docker's embedded DNS is
    # available at this address inside containers, and runtime resolution keeps
    # Nginx from exiting if the backend is briefly unavailable during startup.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend;

    # Forward API requests to the Express backend
    location /api/ {
        proxy_pass http://$backend_upstream:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward application health checks
    location = /health {
        proxy_pass http://$backend_upstream:3001/health;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://$backend_upstream:3001/ready;
        proxy_set_header Host $host;
    }

    # Support React client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
